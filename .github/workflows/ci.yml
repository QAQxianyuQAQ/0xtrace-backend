# GitHub Actions 持续集成：密钥扫描 → 编译 → 单元测试 → 集成测试 → 镜像构建校验
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描仓库凭据
        run: bash scripts/scan-secrets.sh

  build-and-test:
    name: 编译与测试
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 校验工具链并编译
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: 单元测试
        run: mvn -B --no-transfer-progress test
      - name: 集成测试（全链路接口）
        run: mvn -B --no-transfer-progress test -Dtest.excluded.groups=none
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: 上传可执行构件
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/backend-*.jar
          if-no-files-found: error

  docker-build:
    name: 镜像构建校验
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（仅校验 Dockerfile，不推送）
        run: docker build -t tracequest-backend:ci .
