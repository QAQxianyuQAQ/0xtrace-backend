# 示例文件：实际部署请使用 kubectl create secret 或外部密钥管理注入，禁止提交真实密钥
apiVersion: v1
kind: Secret
metadata:
  name: tracequest-backend-secret
  namespace: tracequest
type: Opaque
stringData:
  TQ_DB_USERNAME: "tracequest"
  TQ_DB_PASSWORD: "replace-with-strong-password"
  TQ_REDIS_PASSWORD: ""
  TQ_MINIO_ACCESS_KEY: "replace-with-access-key"
  TQ_MINIO_SECRET_KEY: "replace-with-secret-key"
  TQ_JWT_SECRET: "replace-with-32-bytes-random-secret"
  TQ_ANSWER_SECRET: "replace-with-32-bytes-random-secret"
