apiVersion: v1
kind: ConfigMap
metadata:
  name: tracequest-backend-config
  namespace: tracequest
data:
  TQ_DB_HOST: "mysql.tracequest.svc.cluster.local"
  TQ_DB_PORT: "3306"
  TQ_DB_NAME: "tracequest"
  TQ_REDIS_HOST: "redis.tracequest.svc.cluster.local"
  TQ_REDIS_PORT: "6379"
  TQ_MINIO_ENDPOINT: "http://minio.tracequest.svc.cluster.local:9000"
  TQ_MINIO_BUCKET: "tracequest"
  TQ_EVENT_TIMEZONE: "Asia/Shanghai"
  TQ_COOKIE_SECURE: "true"
  TQ_ENFORCE_SAME_ORIGIN: "true"
  # 生产环境关闭初始化数据装配，账号由运维流程创建
  TQ_BOOTSTRAP_ENABLED: "false"
  TQ_MINIO_INIT: "true"
