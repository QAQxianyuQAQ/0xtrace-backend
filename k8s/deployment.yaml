apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracequest-backend
  namespace: tracequest
  labels:
    app.kubernetes.io/name: tracequest-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tracequest-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracequest-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          # 镜像地址与 GitHub 仓库保持一致（GHCR）
          image: ghcr.io/qaqxianyuqaq/0xtrace-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tracequest-backend-config
            - secretRef:
                name: tracequest-backend-secret
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # 存活与就绪探针统一访问 /api/v1/health
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
