# 本地开发配置：提供可复现的开发默认值，方便 clone 后直接启动
# 严禁将本文件的取值用于测试环境之外的任何部署；生产环境请通过环境变量注入真实凭据。
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tracequest?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    # 仍可用环境变量覆盖，便于本地连接自定义数据库
    username: ${TQ_DB_USERNAME:root}
    password: ${TQ_DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379

tracequest:
  jwt:
    secret: tracequest-local-development-secret-only
  security:
    answer-secret: tracequest-local-development-answer-secret
    cookie-secure: false
    # 本地跨端口联调（如 Vite 5173）时按需填入来源白名单
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
      - http://127.0.0.1:5174
  minio:
    endpoint: http://localhost:9000
    access-key: ${TQ_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${TQ_MINIO_SECRET_KEY:minioadmin}
  bootstrap:
    enabled: true
    admin-username: admin
    admin-password: admin12345

logging:
  level:
    com.qaqxianyuqaq.backend: DEBUG
