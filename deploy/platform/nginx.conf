resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
upstream tracequest_api {
    zone tracequest_api 64k;
    server tracequest-backend:8080 resolve;
}
upstream tq_entry_gateway {
    zone tq_entry_gateway 64k;
    server tq-entry-gateway:8090 resolve;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 60m;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

 location = /api/v1/challenge-connections {
  access_log off;
  # Tickets are query credentials; nginx error diagnostics also include the request URL.
  error_log /dev/null;
  proxy_pass http://tracequest_api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port "";
  proxy_buffering off;
  proxy_read_timeout 330s;
  proxy_send_timeout 330s;
 }
    location ^~ /api/v1/ {
        proxy_pass http://tracequest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port "";
        proxy_read_timeout 120s;
        proxy_hide_header X-Powered-By;
    }

    # --- 参赛者引导脚本：由容器入口网关提供，注入到平台页面右下角「如何做题？」 ---
    location = /tq-guide.js {
        proxy_pass http://tq_entry_gateway;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # --- 题目容器浏览器入口：/entry/<题号>/ 由本队容器网关提供 ---
    location ^~ /entry/ {
        proxy_pass http://tq_entry_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 30m;
    }

    location ^~ /storage/ { return 404; }
    location /api/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # 参赛者不知道 Web 题怎么进：注入引导脚本（改这里即可换文案，脚本在网关仓库 guide.js）
        sub_filter '</body>' '<script src="/tq-guide.js?v=10" defer></script></body>';
        sub_filter_once on;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|mp4|webm|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}