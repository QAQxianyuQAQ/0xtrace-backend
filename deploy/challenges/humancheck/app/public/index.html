<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人机验证 · SACC 2026 选手入口</title>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#dbe3ee; --line2:#eef2f8;
    --blue:#2563eb; --blue-d:#1d4ed8; --blue-soft:#eff6ff;
    --green:#16a34a; --green-soft:#f0fdf4; --red:#dc2626; --red-soft:#fef2f2;
    --amber:#b45309; --amber-soft:#fffbeb; --purple:#7c3aed;
    --bg:#eef2f7; --card:#ffffff;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font:14px/1.6 var(--sans); color:var(--ink); background:var(--bg);
    background-image:
      linear-gradient(0deg, rgba(15,23,42,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,.035) 1px, transparent 1px);
    background-size:32px 32px; -webkit-font-smoothing:antialiased;
  }
  .top{height:56px; display:flex; align-items:center; gap:14px; padding:0 22px;
    background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px}
  .brand .logo{width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#2563eb,#0ea5e9);
    display:grid; place-items:center; color:#fff; font:700 13px/1 var(--sans)}
  .brand small{font-weight:500; color:var(--muted); letter-spacing:0}
  .top .right{margin-left:auto; display:flex; align-items:center; gap:16px; color:var(--muted); font-size:12.5px}
  .top .pill{border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:#f8fafc}
  .top .dot{width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; margin-right:6px}

  main{max-width:1000px; margin:26px auto 60px; padding:0 20px; display:grid; gap:22px;
    grid-template-columns:minmax(0,1fr) 330px; align-items:start}
  @media (max-width:880px){ main{grid-template-columns:minmax(0,1fr)} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; position:relative;
    box-shadow:0 1px 2px rgba(15,23,42,.04), 0 18px 40px -28px rgba(15,23,42,.28); padding:28px 28px 30px}
  .kicker{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); font-weight:700}
  .kicker-row{display:flex; align-items:center; gap:12px}
  .progress{margin-left:auto; font:600 11px/1 var(--mono); color:#94a3b8; letter-spacing:.06em}
  h1{font-size:25px; line-height:1.25; margin:8px 0 6px; letter-spacing:.2px}
  .sub{margin:0 0 22px; color:var(--muted); font-size:13.5px}
  .step[hidden]{display:none}
  .flabel{font-size:12px; color:var(--muted); margin:18px 0 8px; letter-spacing:.02em}
  .flabel:first-child{margin-top:0}
  .flabel .acc{font-size:10.5px; color:#94a3b8}
  .btn{font:600 14px/1 var(--sans); border-radius:8px; border:1px solid transparent; padding:11px 20px;
    cursor:pointer; transition:background .15s ease, transform .12s ease, box-shadow .15s ease}
  .btn.primary{background:var(--blue); color:#fff; box-shadow:0 6px 16px -10px rgba(37,99,235,.9)}
  .btn.primary:hover{background:var(--blue-d)}
  .btn.primary:active{transform:translateY(1px)}
  .btn.ghost{background:#fff; border-color:var(--line); color:var(--ink)}
  .btn.ghost:hover{background:#f8fafc}
  .row{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:18px}
  .rowmsg{color:var(--muted); font-size:12.5px; min-height:18px}
  .rowmsg.err{color:var(--red)}
  .rowmsg.ok{color:var(--green)}
  .msg{margin:14px 0 0; font-size:13px; color:var(--muted); min-height:22px}
  .msg code{font-family:var(--mono); background:#f1f5f9; border:1px solid var(--line2); border-radius:4px; padding:1px 5px; color:#0f172a}
  .msg.err{color:var(--red)}

  /* ---------- 第 1 步：人机验证 ---------- */
  .captcha{display:flex; align-items:center; gap:14px; width:330px; max-width:100%;
    border:1px solid #cfd8e5; border-radius:6px; background:#fbfcfe; padding:14px;
    cursor:pointer; user-select:none; transition:border-color .15s ease, box-shadow .15s ease;
    position:relative; outline:none}
  .captcha:hover{border-color:#b6c2d4}
  .captcha:focus-visible{box-shadow:0 0 0 3px rgba(37,99,235,.22)}
  .captcha .cbox{width:28px; height:28px; border:2px solid #9aa8bd; border-radius:3px; background:#fff; position:relative; flex:none}
  .captcha .tick{position:absolute; inset:0; opacity:0; transform:scale(.6); transition:opacity .18s ease, transform .18s ease;
    background:
      linear-gradient(45deg, transparent 44%, var(--green) 44% 56%, transparent 56%),
      linear-gradient(-45deg, transparent 44%, var(--green) 44% 56%, transparent 56%);
    clip-path:polygon(10% 55%, 40% 85%, 92% 18%, 82% 8%, 40% 66%, 18% 45%)}
  .captcha .spin{position:absolute; inset:-3px; border-radius:6px; opacity:0;
    background:conic-gradient(from 0deg, rgba(138,160,189,0) 0deg, rgba(138,160,189,.22) 110deg, #4b6f9e 320deg, rgba(138,160,189,0) 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px))}
  .captcha.spinning .spin{opacity:1; animation:rot .8s linear infinite}
  .captcha.ok .cbox{border-color:var(--green); background:var(--green-soft)}
  .captcha.ok .tick{opacity:1; transform:none}
  @keyframes rot{to{transform:rotate(360deg)}}
  .captcha .clabel{font-weight:600; font-size:14.5px}
  .captcha .cbrand{margin-left:auto; text-align:right; color:#94a3b8; font-size:10.5px; line-height:1.45}
  .captcha .cbrand b{display:block; color:#64748b; font-size:11px; letter-spacing:.02em}

  /* ---------- 验证码 ---------- */
  .codebox{display:flex; gap:8px; align-items:center; justify-content:space-between;
    width:330px; max-width:100%; padding:14px 16px; border:1px solid var(--line); border-radius:8px;
    background:repeating-linear-gradient(90deg,#f1f5f9 0 2px, transparent 2px 14px), #f8fafc; user-select:none}
  .codebox .g{flex:1; text-align:center; font:700 26px/1 var(--mono); color:#334155;
    filter:blur(4.5px); transform:rotate(-6deg) skewX(-8deg); opacity:.85}
  .codebox .g:nth-child(2n){transform:rotate(5deg) skewX(9deg) translateY(2px)}
  .codebox .g:nth-child(3n){transform:rotate(-2deg) translateY(-2px)}
  .field{position:relative; width:330px; max-width:100%; height:42px; margin:0 0 4px;
    border:1px solid #cfd8e5; border-radius:8px; background:#fff; overflow:hidden;
    transition:border-color .15s ease, box-shadow .15s ease}
  .field:focus-within{border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.16)}
  .field input{position:absolute; inset:0; width:100%; height:100%; border:0; outline:none; opacity:0; font-size:16px; padding:0 12px}
  .field .face{position:absolute; inset:0; display:flex; align-items:center; padding:0 12px;
    font:600 16px/1 var(--mono); letter-spacing:.22em; color:#0f172a; pointer-events:none;
    white-space:nowrap; overflow:hidden}
  .field .face .ph{letter-spacing:0; font:400 14px/1 var(--sans); color:#94a3b8}
  .field .caret{display:inline-block; width:2px; height:18px; background:var(--blue); margin-left:2px; animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .btn-wrap{position:relative; display:inline-block; z-index:30; transition:transform .16s cubic-bezier(.2,.9,.3,1.5)}
  #go{position:relative}
  #shield{position:absolute; inset:-6px; z-index:4; cursor:not-allowed; border-radius:10px}

  /* ---------- 身份选择 ---------- */
  .select{width:330px; max-width:100%; height:42px; border:1px solid #cfd8e5; border-radius:8px;
    background:#fff; padding:0 10px; font:14px/1 var(--sans); color:var(--ink); outline:none}
  .select:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.16)}
  .hintline{font-size:12.5px; color:#94a3b8; margin-top:10px}

  /* ---------- 抄写 ---------- */
  .quote{max-width:330px; margin:0 0 14px; padding:14px 16px; border-radius:8px;
    background:#0f172a; color:#e2e8f0; font:600 16px/1.5 var(--mono); letter-spacing:.08em}
  .txt{width:330px; max-width:100%; height:42px; border:1px solid #cfd8e5; border-radius:8px;
    padding:0 12px; font:600 14px/1 var(--mono); outline:none; color:var(--ink); background:#fff}
  .txt:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.16)}
  .txt[readonly]{background:#f8fafc; color:#94a3b8}

  /* ---------- 最终验证 / 崩溃 ---------- */
  .final-box{border:1px dashed var(--line); border-radius:10px; padding:16px; background:#fbfcfe; max-width:100%}
  .final-box p{margin:0 0 10px; font-size:13px; color:var(--muted)}
  .errlist{font:12px/1.7 var(--mono); color:#64748b; background:#f8fafc; border:1px solid var(--line2);
    border-radius:8px; padding:10px 12px; margin:10px 0 0; overflow:auto}
  .errlist b{color:var(--red); font-weight:600}
  #crash{position:absolute; inset:0; z-index:50; background:#fff; border-radius:14px;
    padding:40px 32px; display:flex; flex-direction:column; align-items:flex-start; gap:10px}
  #crash[hidden]{display:none}
  #crash .em{font-size:34px; line-height:1}
  #crash h2{margin:2px 0 0; font-size:21px; color:#b91c1c}
  #crash .desc{color:var(--muted); font-size:13px; margin:0}
  #crash .code{font:11.5px/1.75 var(--mono); color:#94a3b8; background:#f8fafc; border:1px solid var(--line2);
    border-radius:8px; padding:10px 12px; width:100%; white-space:pre-wrap; word-break:break-word}

  /* ---------- 通关 ---------- */
  .win{position:relative}
  .flag{font:700 18px/1.5 var(--mono); color:#052e16; background:#dcfce7; border:1px dashed #86efac;
    padding:14px 16px; border-radius:10px; letter-spacing:.03em; word-break:break-all; user-select:all; margin:14px 0 0}
  .meta{margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); color:#94a3b8; font-size:12px}
  .meta b{color:#64748b; font-weight:600}

  /* ---------- 小安 ---------- */
  .chat{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 1px 2px rgba(15,23,42,.04), 0 18px 40px -30px rgba(15,23,42,.3); position:sticky; top:82px}
  .chat-head{display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--line2);
    font-weight:600; font-size:13.5px; background:#f8fafc}
  .chat-head .ava{width:24px; height:24px; border-radius:8px; background:linear-gradient(135deg,#0ea5e9,#2563eb);
    color:#fff; display:grid; place-items:center; font:700 11px/1 var(--sans)}
  .chat-head .live{margin-left:auto; font-size:11px; color:var(--green); font-weight:600}
  .chat-head .live::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--green); margin-right:5px; vertical-align:1px}
  .chat-body{max-height:430px; overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth}
  .chat-body::-webkit-scrollbar{width:8px}
  .chat-body::-webkit-scrollbar-thumb{background:#e2e8f0; border-radius:8px}
  .cm{max-width:92%; padding:9px 12px; border-radius:10px; background:#f1f5f9; font-size:13px;
    border:1px solid #e8eef6; animation:pop .22s ease both}
  .cm.tip{background:var(--amber-soft); border-color:#fde68a; color:#78350f}
  .cm.warm{background:var(--blue-soft); border-color:#bfdbfe; color:#1e3a8a}
  .cm.sys{background:#fff; border-color:var(--line); color:#94a3b8; font-size:12px}
  @keyframes pop{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  .foot{max-width:1000px; margin:0 auto 40px; padding:0 20px; color:#94a3b8; font-size:11.5px; display:flex; gap:16px; flex-wrap:wrap}
  .foot a{color:#94a3b8; text-decoration:none; border-bottom:1px dotted #cbd5e1; cursor:pointer}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo">S</span>SACC 2026 <small>选手入口</small></div>
  <div class="right">
    <span class="pill"><span class="dot"></span>报名通道开放中</span>
    <span>剩余名额 4 / 200</span>
  </div>
</header>

<main id="app"></main>

<div class="foot">
  <span>© 2026 SACC 赛事组</span>
  <span>组件版本 2.4.2 · 仅支持人类操作</span>
  <a id="help-link">遇到问题？</a>
</div>
